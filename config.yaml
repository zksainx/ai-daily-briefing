# 编辑边界：这份简报只服务于 AI 工业界动态，不把论文或社区热帖当成成品。
editorial:
  raw_candidates: true
  profile: "ai_industry"
  title: "AI 工业界前沿简报"
  include_academic: false
  include_discovery_sources: false
  include_media_sources: true
  include_community_sources: false
  include_capital_signals: true
  primary_source_required: true
  daily_top_n: 10
  scope:
    - "基础模型与能力发布：LLM、推理、多模态、视频、音频、世界模型、具身智能"
    - "产品与开发平台：Agent、AI 编程、模型 API、企业平台与重要功能更新"
    - "基础设施：芯片、云、数据中心、训练、推理、部署与开源工程生态"
    - "产业化：可核验的客户采用、定价、合作、融资、并购和财报"
  exclusions:
    - "arXiv、论文、学术会议、纯 benchmark 和纯理论研究"
    - "加密货币、区块链和与 AI 无直接关系的融资新闻"
    - "未被一手来源或多源报道证实的社区传闻"

# 数据源配置
sources:
  ai_news: "https://techcrunch.com/category/artificial-intelligence/"
